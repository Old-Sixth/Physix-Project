<body><div id="wrap"></div><div id="stage"></div>
<script>
'use strict';
/* =====================================================================
   PHYSIX — core: constants, maths, formatting, colour, sound
   Constants use the IB Physics data booklet (first assessment 2025)
   values so that anything measured in the sandbox matches the booklet.
   ===================================================================== */
const PS = {};
PS.version = 21; // builds are named n = 7, 8, 9 … (principal quantum number)
PS.VW = 1600; PS.VH = 900; PS.VC = { x: 665, y: 445 }; // logical stage size (grows to fill the window); screen anchor of the camera centre (middle of the free canvas area)

/* ---------- Universe constants (editable in the Universe panel) ---------- */
const K = {
  g: 9.8,             // m s^-2  (Earth's surface)
  G: 6.67e-11,        // N m^2 kg^-2
  NA: 6.02e23,        // mol^-1
  R: 8.31,            // J K^-1 mol^-1
  kB: 1.38e-23,       // J K^-1
  sigma: 5.67e-8,     // W m^-2 K^-4
  k: 8.99e9,          // N m^2 C^-2
  eps0: 8.85e-12,     // C^2 N^-1 m^-2
  mu0: 4 * Math.PI * 1e-7, // T m A^-1
  c: 3.00e8,          // m s^-1
  h: 6.63e-34,        // J s
  e: 1.60e-19,        // C
  me: 9.110e-31,      // kg
  mp: 1.673e-27,      // kg
  mn: 1.675e-27,      // kg
  u: 1.661e-27,       // kg
  uMeV: 931.5,        // MeV c^-2
  meMeV: 0.511,
  S: 1.36e3,          // W m^-2 solar constant
  R0: 1.20e-15,       // m Fermi radius
  wien: 2.9e-3,       // m K
  ly: 9.46e15, pc: 3.26 * 9.46e15, AU: 1.50e11,
};
K.eV = () => K.e;                 // 1 eV in J
K.MeV = () => K.e * 1e6;
const K_DEFAULT = Object.assign({}, K);
PS.K = K; PS.K_DEFAULT = K_DEFAULT;

/* keep electric/magnetic constants mutually consistent when c or k changes */
PS.linkConstants = function (changed) {
  if (changed === 'k') K.eps0 = 1 / (4 * Math.PI * K.k);
  if (changed === 'eps0') K.k = 1 / (4 * Math.PI * K.eps0);
  if (changed === 'c' || changed === 'k' || changed === 'eps0') K.mu0 = 1 / (K.eps0 * K.c * K.c);
  if (changed === 'mu0') K.c = 1 / Math.sqrt(K.mu0 * K.eps0);
  if (changed === 'kB') K.R = K.kB * K.NA;
  if (changed === 'NA') K.R = K.kB * K.NA;
  if (changed === 'R') K.kB = K.R / K.NA;
};

/* ---------- small maths ---------- */
const M = {
  clamp: (x, a, b) => x < a ? a : x > b ? b : x,
  lerp: (a, b, t) => a + (b - a) * t,
  len: (x, y) => Math.hypot(x, y),
  sgn: x => x < 0 ? -1 : 1,
  rnd: (a = 0, b = 1) => a + Math.random() * (b - a),
  gauss() { let u = 0, v = 0; while (u === 0) u = Math.random(); v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  smooth: (cur, target, k) => cur + (target - cur) * k,
  log10: Math.log10,
  rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; },
  cross(ax, ay, bx, by) { return ax * by - ay * bx; },
  sinc(x) { return Math.abs(x) < 1e-9 ? 1 : Math.sin(x) / x; },
  gamma(v) { const b = v / K.c; return b >= 1 ? 1e9 : 1 / Math.sqrt(1 - b * b); },
};
PS.M = M;

/* polygon helpers (CCW, y-up) */
const Poly = {
  area(v) { let a = 0; for (let i = 0, n = v.length; i < n; i++) { const p = v[i], q = v[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; },

      if (!ok() || !limit('trans', 380)) return; const up = dir > 0; const hit = 0.13;
      noise({ ft: 'bandpass', f0: up ? 280 : 3600, f1: up ? 3600 : 280, q: 0.9, dur: 0.22, a: hit, vol: 0.07, wet: 0.45 });            // rush in
      tone({ f0: 120, f1: 34, glide: 0.14, dur: 0.6, vol: 0.44, a: 0.003, wet: 0.15, at: hit });                                         // punch
      noise({ f0: 1800, f1: 80, sweep: 0.4, dur: 0.45, vol: 0.12, a: 0.002, drive: true, at: hit });                                      // crunch
      noise({ ft: 'highpass', f0: 3000, dur: 0.012, vol: 0.05, a: 0.001, wet: 0.2, at: hit });                                           // transient
      noise({ f0: 160, dur: 1.6, vol: 0.09, a: 0.06, wet: 0.7, at: hit + 0.04 });                                                       // rumble
      noise({ ft: 'bandpass', f0: up ? 1800 : 600, f1: up ? 600 : 1800, q: 0.7, dur: 1.4, vol: 0.035, a: 0.05, wet: 0.9, at: hit + 0.05 }); // air tail
    },
    /* the two ends of the universe (nuclear, cosmic) keep the deep tonal swell */
    deep(dir = 1) {
      if (!ok() || !limit('trans', 380)) return; const up = dir > 0;
      tone({ f0: 110, f1: 40, dur: 2.4, vol: 0.5, a: 0.004, wet: 0.3, glide: 0.45 });                       // sub drop
      [1, 1.0065, 0.9935].forEach((k, i) => tone({ type: 'sawtooth', f0: (up ? 55 : 49) * k, f1: (up ? 55 : 49) * k * (up ? 1.012 : 0.985), dur: 2.4, vol: 0.06, a: 0.012, lp: 2400, lp1: 160, lpT: 2.0, q: 3.5, drive: true, detune: (i - 1) * 4 }));
      tone({ type: 'sawtooth', f0: up ? 110 : 98, dur: 1.6, vol: 0.035, a: 0.02, lp: 1600, lp1: 140, lpT: 1.4, drive: true });
      noise({ ft: 'bandpass', f0: up ? 500 : 4200, f1: up ? 4200 : 400, q: 1.1, dur: 1.4, vol: 0.06, a: 0.02, wet: 0.7 });  // air
      tone({ f0: up ? 1760 : 880, dur: 2.6, vol: 0.008, a: 0.35, wet: 1.0 });                                   // distant shimmer
    },
    zoom(dir, zone) { PS.Sound.transition(dir, zone); },
    blip(f = 1200) { if (limit('blip' + Math.round(f / 100), 40)) tone({ f0: f, f1: f * 0.97, dur: 0.07, vol: 0.016, wet: 0.35 }); },
    geiger() { if (!limit('geig', 12)) return; noise({ ft: 'highpass', f0: 2500, dur: 0.004, vol: 0.12, wet: 0.05 }); },
    /* a sustained voice (pipes, generators): set(f, vol) glides smoothly; stop() fades out */
    voice(type = 'sine') {
      if (!ctx) return null; const os = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); os.type = type; lp.type = 'lowpass'; lp.frequency.value = 2600; g.gain.value = 0.0001;
      os.connect(lp); lp.connect(g); route(g, 0.3); os.start(); let dead = false;
      return { set(f, vol) { if (dead) return; const t = ctx.currentTime; os.frequency.setTargetAtTime(M.clamp(f, 20, 12000), t, 0.03); g.gain.setTargetAtTime(muted ? 0.0001 : Math.max(0.0001, vol), t, 0.06); },
        stop() { if (dead) return; dead = true; const t = ctx.currentTime; g.gain.setTargetAtTime(0.0001, t, 0.08); os.stop(t + 0.6); } };
    },
    /* a short burst of rocket roar (called repeatedly while burning) */
    roar(k = 1) { if (!limit('roar', 90)) return; noise({ f0: 900 * (0.7 + 0.3 * k), f1: 300, dur: 0.22, vol: 0.05 * k, a: 0.03, wet: 0.35 }); tone({ f0: 46, f1: 40, dur: 0.2, vol: 0.06 * k, a: 0.03, wet: 0.1 }); },
    thunk() { if (!limit('thunk', 120)) return; tone({ f0: 160, f1: 55, dur: 0.3, vol: 0.22, wet: 0.2 }); noise({ f0: 2200, f1: 200, dur: 0.18, vol: 0.06, wet: 0.3 }); },
  };
})();

/* ---------- toasts: explicit gameplay feedback ---------- */
PS.toast = (() => {
  const last = {};
  return function (msg, kind = 'info', key = null, cooldown = 4000) {
    const k = key || msg; const n = performance.now();
    if (last[k] && n - last[k] < cooldown) return; last[k] = n;
    const host = document.getElementById('toasts'); if (!host) return;
    const el = document.createElement('div'); el.className = 'toast ' + kind;
    el.innerHTML = `<span class="tdot"></span><span>${msg}</span>`;
    host.appendChild(el);
    while (host.children.length > 4) host.removeChild(host.firstChild);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => el.remove(), 500); }, kind === 'success' ? 4200 : 3600);
    if (kind === 'success') PS.Sound.success(); else if (kind === 'fail') PS.Sound.fail();
  };
})();

/* semi-empirical (Weizsäcker) atomic mass for nuclides not in the table */
PS.semfMass = function (Z, A) {
  const N = A - Z; if (A <= 0) return 0;
  const aV = 15.75, aS = 17.8, aC = 0.711, aA = 23.7, aP = 11.18;
  let B = aV * A - aS * Math.pow(A, 2 / 3) - aC * Z * (Z - 1) / Math.pow(A, 1 / 3) - aA * (N - Z) * (N - Z) / A;
  if (A % 2 === 0) B += (Z % 2 === 0 ? 1 : -1) * aP / Math.sqrt(A);
  const mH = 1.007825, mn = 1.008665;
  return Z * mH + N * mn - B / K.uMeV;
};
PS.isoKey = (Z, A) => (PS.ELEMENTS[Z] || ('Z' + Z)) + '-' + A;
PS.isoData = function (Z, A) {
  const key = PS.isoKey(Z, A);
  if (PS.ISOTOPES[key]) return Object.assign({ key }, PS.ISOTOPES[key]);
  return { key, Z, A, m: PS.semfMass(Z, A), name: (PS.ELEMENTS[Z] || 'Z' + Z) + '-' + A, estimated: true };
};
PS.bindingEnergy = function (Z, A, mAtom) { // MeV, using atomic masses
  const mH = 1.007825, mn = 1.008665; return (Z * mH + (A - Z) * mn - mAtom) * K.uMeV;
};

  const a = Math.abs(t);

/* =====================================================================

   Lenses and mirrors are ideal thin elements (see PS.Optics): every ray
   from a point on the object passes through its image, 1/f = 1/u + 1/v.
   Pipes: standing waves for open–open, closed–open and closed–closed
   ends, fₙ = nv/2L or (2n − 1)v/4L, with the speed of sound taken from
   the medium and its temperature; the driven response is the sum of the
   resonant modes, and you can listen to it.

    intro.querySelector('.go').onclick = () => { PS.Sound.init(); intro.classList.add('gone'); setTimeout(() => intro.remove(), 900); setTimeout(() => PS.toast('Drag the square to throw it. Change the medium and gravity in the bar below.', 'info', 'intro'), 900); };
    requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
  };
  return A;
})();
window.addEventListener('load', () => PS.app.start());

/* =====================================================================
   LAYERS — see and change what is drawn in front (human scale)
   The list shows the front-most object at the top. Drag rows to restack.
   The order also decides which object a click picks.
   ===================================================================== */
PS.Layers = (() => {
  let Wn, list, sig = '', drag = null;
  const W = () => PS.Macro;
  const ROW = 34;
  function nameOf(o) {
    if (o.kind === 'body') return o.name || 'Object';
    if (o.kind === 'joint') return { spring: 'Spring', string: 'String', rod: 'Light rod', pin: 'Pivot', scale: 'Newton meter' }[o.type] || 'Connector';
    if (o.kind === 'region') return o.type === 'E' ? 'Electric field' : 'Magnetic field';
    if (o.kind === 'gate') return 'Light gate ' + o.num;
    return o.name || { plates: 'Parallel plates', ruler: 'Ruler', stopwatch: 'Stopwatch', probe: 'Probe', gun: 'Particle gun', ripple: 'Ripple tank', wstring: 'Vibrating string' }[o.kind] || o.kind;
  }
  function subOf(o) {
    if (o.kind === 'body') { const m = PS.MATERIALS[o.mat]; return (o.role !== 'plain' ? ({ container: 'container', tank: 'liquid tank', magnet: 'magnet', coil: 'coil', solenoid: 'solenoid', wire: 'wire', laser: 'light source', slide: 'slits', screen: 'screen', mirror: 'mirror', sound: 'sound source', mic: 'microphone', balance: 'balance' }[o.role] || o.role) + ' · ' : '') + (m ? m.name : ''); }
    if (o.kind === 'joint') return 'connector'; if (o.kind === 'region' || o.kind === 'plates') return 'field'; return 'equipment';
  }
  function iconOf(o) {
    if (o.kind === 'body') return o.role === 'container' ? 'box' : o.role === 'tank' ? 'tank' : o.role === 'magnet' ? 'magnet' : o.role === 'coil' || o.role === 'solenoid' ? 'coil' : o.role === 'laser' ? 'laser' : o.role === 'screen' ? 'screen' : o.role === 'slide' ? 'slit' : o.role === 'wire' ? 'wire' : o.shape.type === 'circle' ? 'circle' : 'square';
    return { joint: o.type === 'pin' ? 'pin' : o.type === 'string' || o.type === 'rod' ? 'link' : 'spring', region: 'field', plates: 'plate', gate: 'gate', ruler: 'ruler', stopwatch: 'timer', probe: 'probe', gun: 'gun', ripple: 'ripple', wstring: 'string' }[o.kind] || 'info';
  }
  function init() {
    Wn = PS.ui.win('layers', 'Layers', 68, 64, 286, 560);
    Wn.body.innerHTML = `<div class="note" style="margin:8px 12px 6px">Top of the list is in front. Drag a row to move it; click to select.</div>
      <div class="btnrow" id="ly-btns" style="padding:2px 12px 8px"></div>
      <div id="ly-list" style="position:relative;margin:0 8px 10px"></div>`;
    list = Wn.body.querySelector('#ly-list');
    const bt = Wn.body.querySelector('#ly-btns');
    [['Front', () => move('front')], ['Forward', () => move(1)], ['Backward', () => move(-1)], ['Back', () => move('back')]].forEach(([t, f]) => { const b = PS.ui.el('div', 'btn', t); b.onclick = () => { PS.Sound.tick(); f(); }; bt.appendChild(b); });
    Wn.onShow = () => { sig = ''; render(); };
  }
  function move(how) {
    const objs = W().objs, o = PS.app.sel; const i = objs.indexOf(o); if (i < 0) { PS.toast('Select an object first', 'fail', 'lyr', 1500); return; }
    objs.splice(i, 1); let j = how === 'front' ? objs.length : how === 'back' ? 0 : M.clamp(i + how, 0, objs.length); objs.splice(j, 0, o); sig = ''; render();
  }
  function render() {
    if (!Wn || !Wn.open) return;
    if (PS.app.world !== PS.Macro) { list.innerHTML = '<div class="empty" style="padding:14px 6px">Layers apply to the human scale, where objects can overlap.</div>'; return; }
    const objs = W().objs.slice().reverse(); list.innerHTML = '';
    if (!objs.length) { list.innerHTML = '<div class="empty" style="padding:14px 6px">Nothing placed yet.</div>'; return; }
    list.style.height = objs.length * ROW + 'px';
    objs.forEach((o, k) => {
      const r = PS.ui.el('div', 'lyrow' + (PS.app.sel === o ? ' on' : ''));
      r.style.cssText = `position:absolute;left:0;right:0;top:${k * ROW}px;height:${ROW - 3}px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:7px;cursor:grab;font-size:12px;color:#d5dae2;background:${PS.app.sel === o ? 'rgba(79,210,255,.12)' : 'rgba(255,255,255,.03)'};border:1px solid ${PS.app.sel === o ? 'rgba(79,210,255,.35)' : 'transparent'};transition:top .12s`;
      r.innerHTML = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor;opacity:.35;flex:none"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        <span style="width:18px;height:18px;flex:none;display:flex;color:#aeb5c0">${PS.icon(iconOf(o), 'style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"')}</span>
        <span style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${nameOf(o)}<span style="color:var(--faint);font-size:10.5px;margin-left:6px">${subOf(o)}</span></span>
        ${o.locked ? `<span style="width:14px;height:14px;display:flex;color:var(--dim)">${PS.icon('lock', 'style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8"')}</span>` : ''}`;
      r.addEventListener('pointerdown', e => {
        e.preventDefault(); r.setPointerCapture(e.pointerId); drag = { o, k, y0: e.clientY, r, moved: false, n: objs.length, to: k };
      });
      r.addEventListener('pointermove', e => {
        if (!drag || drag.r !== r) return; const dy = (e.clientY - drag.y0) / PS.ui.scale; if (!drag.moved && Math.abs(dy) < 4) return;
        drag.moved = true; r.style.transition = 'none'; r.style.zIndex = 5; r.style.cursor = 'grabbing'; r.style.boxShadow = '0 6px 18px rgba(0,0,0,.45)'; r.style.top = (drag.k * ROW + dy) + 'px';
        const to = M.clamp(Math.round((drag.k * ROW + dy) / ROW), 0, drag.n - 1); drag.to = to;
        [...list.children].forEach((c, idx) => { if (c === r) return; let pos = idx; if (idx > drag.k && idx <= to) pos = idx - 1; else if (idx < drag.k && idx >= to) pos = idx + 1; c.style.top = pos * ROW + 'px'; });
      });
      r.addEventListener('pointerup', () => {
        if (!drag || drag.r !== r) return; const d = drag; drag = null;
        if (!d.moved) { PS.app.select(d.o); sig = ''; render(); return; }
        if (d.to !== d.k) { const arr = W().objs; const i = arr.indexOf(d.o); arr.splice(i, 1); arr.splice(arr.length - d.to, 0, d.o); PS.Sound.tick(); PS.app.select(d.o); }
        sig = ''; render();
      });
      list.appendChild(r);
    });
  }
  function frame() {
    if (!Wn || !Wn.open || drag) return;
    const w = PS.app.world; const s = w === PS.Macro ? W().objs.map(o => o.id + (o.locked ? 'L' : '') + (o.name || '')).join(',') + '|' + (PS.app.sel && PS.app.sel.id) : 'x' + w.id;
    if (s !== sig) { sig = s; render(); }
  }
  return { toggle: () => { if (!Wn) init(); Wn.toggle(); }, frame, render };
})();

</script></body></html>
